openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders/{order_id}:
    get:
      operationId: getOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
        - name: expand
          in: query
          schema:
            type: string
            enum: [items, customer]
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
components:
  schemas:
    Order:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [draft, paid, shipped]
        note:
          type: string
          maxLength: 500
