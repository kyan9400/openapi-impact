openapi: 3.1.0
info:
  title: Orders API
  version: 2.0.0
paths:
  /orders/{order_id}:
    get:
      operationId: findOrder
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
        - name: expand
          in: query
          schema:
            type: string
            enum: [items]
        - name: locale
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Order:
      type: object
      required: [id, status, currency]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [paid, shipped]
        currency:
          type: string
        note:
          type: string
          maxLength: 120
