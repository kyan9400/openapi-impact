[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openapi-impact"
version = "1.0.0"
description = "Detect breaking changes between OpenAPI specifications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hassan Ak" }]
keywords = ["openapi", "api", "breaking-changes", "cli", "ci"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
openapi-impact = "openapi_impact.cli:main"

[project.urls]
Homepage = "https://github.com/kyan9400/openapi-impact"
Issues = "https://github.com/kyan9400/openapi-impact/issues"
Source = "https://github.com/kyan9400/openapi-impact"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_impact"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=openapi_impact --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
